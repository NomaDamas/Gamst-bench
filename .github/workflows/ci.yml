name: Validate benchmark
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: NomaDamas/Gamst
          ref: feat/temporal-contract
          path: gamst
      - uses: actions/checkout@v4
        with:
          repository: NomaDamas/GamstCrew
          ref: feat/runtime-pr
          path: GamstCrew
      - uses: actions/setup-node@v4
        with:
          node-version: '22.22.0'
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Configure runtime integration roots
        run: |
          echo "GAMST_ROOT=${GITHUB_WORKSPACE}/gamst" >> "$GITHUB_ENV"
          echo "GAMST_CREW_ROOT=${GITHUB_WORKSPACE}/GamstCrew" >> "$GITHUB_ENV"
          echo "PYTHONPATH=${GITHUB_WORKSPACE}/gamst:${GITHUB_WORKSPACE}/GamstCrew:${GITHUB_WORKSPACE}" >> "$GITHUB_ENV"
      - run: npm ci
      - run: python -m pip install -r requirements-mcp.txt
      - run: npm run test:python
      - run: npm run results:check
      - run: npm test
      - run: npm run build
